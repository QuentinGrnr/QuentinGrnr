<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300"
     width="1200" height="300" role="img"
     aria-label="Quentin Garnier - Mobile &amp; Embedded IoT Engineer. 10k+ devices deployed, less than 2.5% return rate, 400+ second brain notes.">
  <title>Quentin Garnier - Mobile &amp; Embedded IoT Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    .name   { font: 700 50px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .role   { font: 400 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .tag    { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #38bdf8; letter-spacing: 0.4px; }
    .section { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #38bdf8; letter-spacing: 2px; }
    .stat-value { font: 700 38px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f8fafc; }
    .stat-label { font: 600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1.2px; }
    .stamp  { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }

    .wave { animation: pulse 3.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.25; }
      50%      { stroke-opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave { animation: none; }
    }
  ]]></style>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>

    <!-- subtle RF / BLE digital pulse wave across the lower section (y 252..272) -->
    <path class="wave" d="M -20 262 H 40 l 6 -20 l 8 36 l 8 -16 H 160 l 6 -20 l 8 36 l 8 -16 H 280 l 6 -20 l 8 36 l 8 -16 H 400 l 6 -20 l 8 36 l 8 -16 H 520 l 6 -20 l 8 36 l 8 -16 H 640 l 6 -20 l 8 36 l 8 -16 H 760 l 6 -20 l 8 36 l 8 -16 H 880 l 6 -20 l 8 36 l 8 -16 H 1000 l 6 -20 l 8 36 l 8 -16 H 1120 l 6 -20 l 8 36 l 8 -16 H 1220"
          fill="none" stroke="#38bdf8" stroke-opacity="0.32"
          stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Bottom glowing accent bar -->
    <rect x="0" y="297" width="1200" height="3" fill="url(#glow)"/>

    <!-- Left side info -->
    <text class="name" x="56" y="106">Quentin Garnier</text>
    <rect x="58" y="122" width="56" height="3" rx="1.5" fill="#38bdf8"/>
    <text class="role" x="56" y="164">Mobile &amp; Embedded IoT · Software Architecture</text>
    <text class="tag" x="56" y="202">Bridging connected hardware &amp; mobile apps with clean code</text>

    <!-- Vertical separator line -->
    <line x1="710" y1="55" x2="710" y2="205" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Right side metrics -->
    <text class="section" x="740" y="78">KEY HIGHLIGHTS</text>
    <g>
      <text class="stat-value" x="785" y="136" text-anchor="middle">10k+</text>
      <text class="stat-label" x="785" y="162" text-anchor="middle">DEVICES DEPLOYED</text>

      <text class="stat-value" x="935" y="136" text-anchor="middle">&lt; 2.5%</text>
      <text class="stat-label" x="935" y="162" text-anchor="middle">RMA RETURN RATE</text>

      <text class="stat-value" x="1080" y="136" text-anchor="middle">400+</text>
      <text class="stat-label" x="1080" y="162" text-anchor="middle">SECOND BRAIN NOTES</text>
    </g>

    <!-- Subtitle tag under stats -->
    <text class="stamp" x="1135" y="202" text-anchor="end">Kotlin · Swift · Rust · BLE · CI/CD · MCP</text>
  </g>

  <!-- Outer subtle card border -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16"
        fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
