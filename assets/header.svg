<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280"
     width="1200" height="280" role="img"
     aria-label="Quentin Garnier - Mobile &amp; Embedded IoT Developer">
  <title>Quentin Garnier - Mobile &amp; Embedded IoT Developer</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="60%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#111c35"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Clip Path -->
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    .name      { font: 700 48px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .role      { font: 500 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #38bdf8; letter-spacing: 0.2px; }
    .tag       { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    
    .panel-bg  { fill: #0b1120; stroke: #1e293b; stroke-width: 1; rx: 10px; }
    .card-title { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #38bdf8; letter-spacing: 1.5px; }
    .card-main  { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f1f5f9; }
    .card-sub   { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }

    /* Digital clock & bus packet trace animation */
    .bus-trace { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.25; }
      50%      { stroke-opacity: 0.65; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bus-trace { animation: none; }
    }
  ]]></style>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="280" fill="url(#bg)"/>

    <!-- Subtle circuit grid dots -->
    <g opacity="0.15" fill="#38bdf8">
      <circle cx="100" cy="40" r="1.5"/><circle cx="140" cy="40" r="1.5"/><circle cx="180" cy="40" r="1.5"/>
      <circle cx="100" cy="80" r="1.5"/><circle cx="140" cy="80" r="1.5"/><circle cx="180" cy="80" r="1.5"/>
      <circle cx="60" cy="120" r="1.5"/><circle cx="100" cy="120" r="1.5"/><circle cx="140" cy="120" r="1.5"/>
    </g>

    <!-- Digital Signal & Bus Clock Wave (hardware communication packets) across the lower band (y: 245) -->
    <path class="bus-trace" d="M -10 248 H 50 V 232 H 80 V 248 H 150 V 232 H 180 V 248 H 220 V 232 H 240 V 248 H 310 V 232 H 350 V 248 H 430 V 232 H 460 V 248 H 530 V 232 H 560 V 248 H 630 V 232 H 660 V 248 H 730 V 232 H 770 V 248 H 840 V 232 H 870 V 248 H 940 V 232 H 970 V 248 H 1040 V 232 H 1070 V 248 H 1130 V 232 H 1160 V 248 H 1220"
          fill="none" stroke="#38bdf8" stroke-opacity="0.35"
          stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"/>

    <!-- Bottom glowing line -->
    <rect x="0" y="277" width="1200" height="3" fill="url(#glow)"/>

    <!-- Left section: Identity & Focus -->
    <text class="name" x="55" y="102">Quentin Garnier</text>
    <rect x="57" y="118" width="52" height="3" rx="1.5" fill="#38bdf8"/>
    <text class="role" x="55" y="158">Mobile &amp; Embedded IoT Developer</text>
    <text class="tag" x="55" y="194">Bridging physical devices &amp; mobile apps with clean, scalable architecture</text>

    <!-- Right section: 2 technical spec cards -->
    <!-- Card 1: Core Systems -->
    <g transform="translate(680, 52)">
      <rect class="panel-bg" width="225" height="152"/>
      <circle cx="20" cy="28" r="4" fill="#38bdf8"/>
      <text class="card-title" x="32" y="32">HARDWARE &amp; IOT</text>
      <text class="card-main" x="20" y="68">BLE · STM32 · nRF</text>
      <text class="card-sub" x="20" y="92">DFU OTA &amp; USB Bootloaders</text>
      <text class="card-sub" x="20" y="112">ISO 7816 / APDU Smartcards</text>
      <text class="card-sub" x="20" y="132">Rust &amp; Hardware Simulators</text>
    </g>

    <!-- Card 2: Mobile & Delivery -->
    <g transform="translate(925, 52)">
      <rect class="panel-bg" width="225" height="152"/>
      <circle cx="20" cy="28" r="4" fill="#818cf8"/>
      <text class="card-title" x="32" y="32" fill="#818cf8">MOBILE &amp; DELIVERY</text>
      <text class="card-main" x="20" y="68">Kotlin · Swift · Capacitor</text>
      <text class="card-sub" x="20" y="92">Command Pattern &amp; Modular Archi</text>
      <text class="card-sub" x="20" y="112">Automated CI/CD (Fastlane)</text>
      <text class="card-sub" x="20" y="132">Firebase, Play Store &amp; TestFlight</text>
    </g>

  </g>

  <!-- Outer frame border -->
  <rect x="0.5" y="0.5" width="1199" height="279" rx="16"
        fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
