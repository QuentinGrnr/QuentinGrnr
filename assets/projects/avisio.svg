<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340"
     width="1200" height="340" role="img"
     aria-label="AviSio - Inclusive lecture streaming box">
  <title>AviSio - Inclusive lecture streaming box</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="340" rx="16"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    .ascii     { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f5a623; white-space: pre; }
    .ascii-sub { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f5a623; fill-opacity: 0.7; }
    .label     { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f5a623; letter-spacing: 1.5px; }
    .title     { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle  { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #38bdf8; }
    .desc      { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .bullet    { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .stat-value { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.3px; }
    .stat-label { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    .ascii-panel { fill: #0b1120; stroke: #1e293b; stroke-width: 1; }
    .cursor { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  ]]></style>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="340" fill="#0b0f19"/>

    <!-- Left: ASCII art panel -->
    <rect class="ascii-panel" x="30" y="24" width="330" height="292" rx="10"/>
    <circle cx="48" cy="40" r="3.5" fill="#ef4444" fill-opacity="0.6"/>
    <circle cx="60" cy="40" r="3.5" fill="#eab308" fill-opacity="0.6"/>
    <circle cx="72" cy="40" r="3.5" fill="#22c55e" fill-opacity="0.6"/>
    <text class="ascii-sub" x="342" y="44" text-anchor="end">~/avisio<tspan class="cursor">_</tspan></text>
    <text class="ascii" xml:space="preserve" x="49.8" y="112.2" textLength="270.6" lengthAdjust="spacing">    -:            .-.   :==:   .-.   :-=:</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="124.8" textLength="283.8" lengthAdjust="spacing">   :#*            =%+ .*####*: =%+  +####*:</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="137.2" textLength="290.4" lengthAdjust="spacing">   +##=           .=: +#-..-%+ :=: +%+.-##*.</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="149.8" textLength="290.4" lengthAdjust="spacing">  .#+**   =+   =+ .+- +#:   +- .+- **.=*+=%-</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="162.2" textLength="290.4" lengthAdjust="spacing">  =#:-%-  -%- .#+ -%= -##+=:   -%= #**=:*+#-</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="174.8" textLength="290.4" lengthAdjust="spacing"> .#* .#*   ** =#: -#-  .+*##*: -#- ***  +*#-</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="187.2" textLength="290.4" lengthAdjust="spacing"> =######-  =#.**  -#- ::  .-#* -%- #**. +*#-</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="199.8" textLength="290.4" lengthAdjust="spacing">.*#====#*  .#+#-  -#- *#.   *# :%- *#+++**#:</text>
    <text class="ascii" xml:space="preserve" x="49.8" y="212.2" textLength="283.8" lengthAdjust="spacing">-#+    *#.  +#*   -#- +#*=-+#+ -#= -#*+**#+</text>
    <text class="ascii-sub" xml:space="preserve" x="195.0" y="243.5" text-anchor="middle">A V I G N O N   U N I V E R S I T É</text>

    <!-- Right: project details -->
    <circle cx="434" cy="52" r="4" fill="#f5a623"/>
    <text class="label" x="446" y="56">EMBEDDED · ACCESSIBILITY</text>
    <text class="title" x="430" y="98">AviSio</text>
    <text class="subtitle" x="430" y="126">Inclusive lecture streaming box</text>
    <text class="desc" x="430" y="150">Live lectures for students with disabilities.</text>
    <text class="bullet" x="430" y="176"><tspan fill="#f5a623">▸</tspan>  Raspberry Pi on Linux, plug-and-play camera / mic</text>
    <text class="bullet" x="430" y="200"><tspan fill="#f5a623">▸</tspan>  RTMP stream over a VPN tunnel to the university</text>
    <text class="bullet" x="430" y="224"><tspan fill="#f5a623">▸</tspan>  Touch interface with video preview and chat</text>
    <line x1="430" y1="262" x2="1170" y2="262" stroke="#1e293b" stroke-width="1"/>
    <text class="stat-value" x="430" y="296" fill="#f5a623">2024</text>
    <text class="stat-label" x="430" y="314">in use in lecture halls</text>
    <line x1="605.8" y1="280" x2="605.8" y2="312" stroke="#1e293b" stroke-width="1"/>
    <text class="stat-value" x="629.8" y="296" fill="#f5a623">0</text>
    <text class="stat-label" x="629.8" y="314">setup steps for teachers</text>

    <rect x="0" y="337" width="1200" height="3" fill="url(#glow)"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="16"
        fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
