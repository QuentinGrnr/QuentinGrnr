name: Generate Contribution Snake

on:
  schedule:
    # Runs daily at 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # The daily metrics commit should not regenerate the snake
    paths-ignore: [assets/metrics.svg]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: QuentinGrnr
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
